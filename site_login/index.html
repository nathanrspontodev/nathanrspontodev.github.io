<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Página de login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>-CADASTRO-</h1>

  <form id="meuFormulario">

    <div>
      <label for="nome" class = "label-nome">NOME COMPLETO:</label>
      <input type="text" id="nome" name="nome">
    </div>

    <div>
      <label for="email"class = "label-email">E-MAIL:</label>
      <input type="email" id="email" name="email">
    </div>

    <div>
      <label for="tel" class = "label-tel">TELEFONE:</label>
      <input type="text" id="tel" name="tel">
    </div>

    <div>
      <label for="cpf" class = "label-cpf">CPF:</label>
      <input type="text" id="cpf" name="cpf">
    </div>

    <button type="submit">Confirmar</button>
  <p id="mensagemSucesso">Formulário enviado com sucesso!</p>

  </form>
</form>

  <script src="script.js"></script>
</body>
</html>
