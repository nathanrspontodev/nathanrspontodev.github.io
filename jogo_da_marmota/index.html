<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jogo Da Marmota!</title>
  <link href='https://fonts.googleapis.com/css?family=Amatic+SC:400,700' rel='stylesheet' type='text/css'>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Whack-a-mole! <span class="score">0</span></h1>
  <button onClick="startGame()">Jogar!</button>
  <div class="timer">Tempo: <span class="time">10</span>s</div>

  <div class="game">
    <div class="hole hole1">
      <div class="mole"></div>
    </div>
    <div class="hole hole2">
      <div class="mole"></div>
    </div>
    <div class="hole hole3">
      <div class="mole"></div>
    </div>
    <div class="hole hole4">
      <div class="mole"></div>
    </div>
    <div class="hole hole5">
      <div class="mole"></div>
    </div>
    <div class="hole hole6">
      <div class="mole"></div>
    </div>
  </div>

  <table class="stats">
    <thead>
      <tr><th>Acertos</th><th>Erros</th></tr>
    </thead>
    <tbody>
      <tr><td class="hits">0</td><td class="misses">0</td></tr>
    </tbody>
  </table>

<script>
  const holes = document.querySelectorAll('.hole');
  const scoreBoard = document.querySelector('.score');
  const moles = document.querySelectorAll('.mole');
  const startButton = document.querySelector('button');
  const timeDisplay = document.querySelector('.time');
  const hitsCell = document.querySelector('.hits');
  const missesCell = document.querySelector('.misses');

  const GAME_DURATION = 10000;

  let lastHole;
  let timeUp = true;
  let score = 0;
  let misses = 0;
  let peepTimer;
  let countdown;

  function randomTime(min, max) {
    return Math.round(Math.random() * (max - min) + min);
  }

  function randomHole(holes) {
    const idx = Math.floor(Math.random() * holes.length);
    const hole = holes[idx];
    if (hole === lastHole) {
      return randomHole(holes);
    }
    lastHole = hole;
    return hole;
  }

  function peep() {
    const time = randomTime(400, 1100);
    const hole = randomHole(holes);
    hole.classList.add('up');
    peepTimer = setTimeout(() => {
      hole.classList.remove('up');
      if (!timeUp) peep();
    }, time);
  }

  function updateStats() {
    scoreBoard.textContent = score;
    hitsCell.textContent = score;
    missesCell.textContent = misses;
  }

  function endGame() {
    timeUp = true;
    clearInterval(countdown);
    timeDisplay.textContent = 0;
    startButton.disabled = false;
  }

  function startGame() {
    clearTimeout(peepTimer);
    clearInterval(countdown);
    holes.forEach(hole => hole.classList.remove('up'));
    timeUp = false;
    score = 0;
    misses = 0;
    lastHole = undefined;
    updateStats();
    startButton.disabled = true;

    const endTime = Date.now() + GAME_DURATION;
    timeDisplay.textContent = GAME_DURATION / 1000;
    countdown = setInterval(() => {
      const remaining = endTime - Date.now();
      if (remaining <= 0) {
        endGame();
      } else {
        timeDisplay.textContent = Math.ceil(remaining / 1000);
      }
    }, 100);

    peep();
  }

  function whack(e) {
    if (!e.isTrusted) return;
    if (timeUp) return;
    if (this.classList.contains('up')) {
      score++;
      this.classList.remove('up');
    } else {
      misses++;
    }
    updateStats();
  }

  holes.forEach(hole => hole.addEventListener('click', whack));
</script>
</body>
</html>
